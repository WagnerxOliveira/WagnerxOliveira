name: WakaTime & GitHub Metrics Cyberpunk

on:
  schedule:
    - cron: "0 0 * * *" # Atualiza todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente
  push:
    branches: ["main"]

jobs:
  wakatime-github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Cyberpunk Dashboard
        uses: lowlighter/metrics@latest
        with:
          # Token para LER seus dados
          token: ${{ secrets.METRICS_TOKEN }}
          # Token nativo para SALVAR o arquivo gerado (Resolve o erro do SHA)
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Configurações visuais do Dashboard
          template: classic
          theme: tokyonight
          config_timezone: America/Sao_Paulo
          filename: cyberpunk-dashboard.svg
          committer_branch: output
          
          # Base do GitHub (Sem indepth para não travar por 12 minutos)
          base: header, activity, community, repositories, metadata

          # 1. Gráfico Isométrico 3D (A Cidade de Código)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 2. Linguagens Futuristas 
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_details: bytes-size, percentage

          # 3. Hábitos (Matriz Cyberpunk)
          plugin_habits: yes
          plugin_habits_charts_type: chartist
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_from: 200

          # 4. Integração WakaTime
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs
          plugin_wakatime_limit: 4
