name: WakaTime & GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 
  push:
    branches: ["main"]

jobs:
  wakatime-github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Cyberpunk Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}

          # Configuração Visual Cyberpunk
          theme: tokyonight
          template: classic
          base: "" # MÁGICA AQUI: Isso remove toda aquela parede de texto e foto duplicada
          config_timezone: America/Sao_Paulo

          # 1. Gráfico 3D Isométrico (Apenas a arte da "cidade")
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 2. Gráfico de Rosca (Donut) Elegante para Linguagens
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 5
          # Removido o limite de commits recentes para ler o repositório inteiro

          # 3. WakaTime Turbo (Tempo Real)
          plugin_wakatime: yes
          plugin_wakatime_days: 7
          plugin_wakatime_limit: 5
          # Agora ele vai gerar gráficos detalhados das linguagens e editores (VS Code, etc)
          plugin_wakatime_sections: time, languages, languages-graphs, editors

          # Output Limpo
          filename: cyberpunk-dashboard.svg
          committer_branch: output
