name: WakaTime & GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 
  push:
    branches: ["main"]

jobs:
  wakatime-github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: WakaTime and GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}

          # Tema escuro com alto contraste e sem as listas de texto padrão
          theme: tokyonight
          template: classic
          base: header
          config_timezone: America/Sao_Paulo

          # 1. Gráfico 3D Isométrico de Contribuições (Estilo Cyber-City)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 2. Gráfico de Rosca (Donut) para Linguagens
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 5
          plugin_languages_indepth: yes

          # 3. Gráfico de Barras de Hábitos (Seus horários de pico programando)
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_days: 14

          # 4. Dashboard do WakaTime Limpo
          plugin_wakatime: yes
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, projects
          plugin_wakatime_limit: 4

          filename: cyberpunk-dashboard.svg
          committer_branch: output
