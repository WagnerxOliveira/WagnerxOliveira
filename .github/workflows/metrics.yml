name: WakaTime & GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 
  push:
    branches: ["main"]

jobs:
  wakatime-github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Cyberpunk Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}

          # Tema de alto contraste e remoção da parede de texto base
          theme: tokyonight
          template: classic
          base: "" 
          config_timezone: America/Sao_Paulo

          # 1. Gráfico 3D Isométrico (A "Cidade" de Contribuições)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 2. Gráfico de Rosca (Donut) Futurista - COM DEEP SCAN
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 6
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes

          # 3. Gráfico de Hábitos (Visual de Punchcard tech)
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_from: 200

          # 4. Dashboard do WakaTime em Tempo Real
          plugin_wakatime: yes
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, languages-graphs, editors
          plugin_wakatime_limit: 5

          filename: cyberpunk-dashboard.svg
          committer_branch: output
