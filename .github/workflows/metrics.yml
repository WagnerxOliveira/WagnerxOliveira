name: Cyberpunk Profile Engine (Metrics, 3D & Cards)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # JOB 1: O Dashboard Base
  # ---------------------------------------------------------
  wakatime-github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Cyberpunk Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          template: classic
          theme: tokyonight
          config_timezone: America/Sao_Paulo
          filename: cyberpunk-dashboard.svg
          committer_branch: output
          base: header, activity, metadata
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, languages-graphs, editors
          plugin_wakatime_limit: 5
          plugin_habits: yes
          plugin_habits_charts_type: chartist
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_from: 200

  # ---------------------------------------------------------
  # JOB 2: Gráfico 3D Avançado
  # ---------------------------------------------------------
  generate-3d-contrib:
    runs-on: ubuntu-latest
    needs: wakatime-github-metrics
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D Contribution Graph (Radar & Donut)
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push 3D Graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Auto-generated 3D contrib graphs" || echo "No changes to commit"
          git pull --rebase origin main
          git push

  # ---------------------------------------------------------
  # JOB 3: Cards de Resumo (O FIX ESTÁ AQUI)
  # ---------------------------------------------------------
  generate-summary-cards:
    runs-on: ubuntu-latest
    needs: generate-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # A MÁGICA: Garante que baixa as atualizações feitas pelo Job 2 antes de rodar
      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight
